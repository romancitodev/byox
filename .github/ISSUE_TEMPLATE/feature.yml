name: Feature request
description: Propose an improvement or a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: You can write in English or Spanish (también se acepta español).
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: What you want to do and cannot (or find hard to) do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MCP server / API
        - Web app, landing page or documentation
        - CLI (byox)
        - Installation or deploy
        - Courses
        - I don't know
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Collaboration
      options:
        - label: I could implement it myself
