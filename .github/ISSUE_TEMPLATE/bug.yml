name: Bug report
description: Something does not work as the documentation says
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. You can write in English or Spanish (también se acepta español).
        If it is a security problem, **do not post it here**: use private reporting (see SECURITY.md).
        Do not paste tokens, passwords or the contents of your `.env`.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MCP server / API
        - Web app, landing page or documentation
        - CLI (byox)
        - Installation (setup.sh, Docker Compose)
        - Deploy (deploy/k8s-sim)
        - A course (courses/ or examples/)
        - I don't know
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, byox commit, browser if it applies, and the relevant `.env` variables (`BYOX_SIGNUP`, `BYOX_AUTHORS`, etc.; no secrets).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: For example `docker compose logs mcp`. Check that they contain no secrets.
      render: text
