name: Course proposal
description: Propose a "build your own X" course (propuesta de curso)
title: "[Course] build-your-own-"
labels: ["curso"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Spanish (también se acepta español).
        Before proposing, read the format guide (`byox guide`, or `mcp/assets/guide.md`) and the requirements in CONTRIBUTING.md.
        Courses do not copy tests, statements or text from copyrighted material: they are based on official documentation and specifications.
  - type: input
    id: topic
    attributes:
      label: What gets built
      placeholder: For example, an HTTP server, an interpreter, a search engine
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: The Docker image where the tests would run, if you have thought about it.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who it is for and what is learned
    validations:
      required: true
  - type: textarea
    id: stages
    attributes:
      label: Stages (draft)
      description: A tentative list of milestones and stages, and what they depend on.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Official documentation, specifications or reference implementations you will use.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who would write it?
      options:
        - Me
        - I am proposing it but will not write it
        - Me, with the help of an AI assistant
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I understand that the courses in this repository are published under CC BY-SA 4.0
          required: true
