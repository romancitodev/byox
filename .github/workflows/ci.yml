name: CI

# Only builds and tests: this workflow publishes nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    name: MCP server (tsc and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with tsc
        run: docker build --target build -t byox-mcp:build ./mcp
      - name: Run the tests
        run: docker run --rm -v "$PWD/mcp/test:/app/test:ro" byox-mcp:build node --test "test/*.test.mjs"

  web:
    name: Web app (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the landing page, documentation and app
        run: docker build --target web -t byox-mcp:web ./mcp

  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: cli
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --locked
