title: build-your-own-redis
description: "Un Redis en Rust desde cero: RESP, un servidor concurrente, strings, expiración, persistencia, transacciones, pub/sub, replicación y streams."
image: rust:1.99
topics: [rust, redis, redes, protocolos, concurrencia, bases-de-datos]
origin: ai

milestones:
  - id: resp
    title: "Protocolo RESP"
    description: "Leer y escribir el protocolo de Redis, probado con bytes, todavía sin red."
  - id: server
    title: "El servidor"
    description: "Un servidor TCP que atiende a muchos clientes, entiende RESP e inline, y valida los comandos."
  - id: strings
    title: "Strings y claves"
    description: "SET, GET y los comandos que convierten al servidor en una base de datos."
  - id: expire
    title: "Expiración"
    description: "Claves que vencen solas: la expiración pasiva al leer y la activa en segundo plano."
  - id: lists
    title: "Listas"
    description: "El primer tipo que no es un string: listas, WRONGTYPE y BLPOP con clientes que esperan en orden."

