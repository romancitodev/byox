# VPS A: Forgejo sobre Postgres. Es el `forgejo` de docker-compose.yml + docker-compose.cloud.yml.
apiVersion: v1
kind: Service
metadata: { name: forgejo, namespace: byox }
spec:
  type: NodePort
  selector: { app: forgejo }
  ports: [{ port: 3000, nodePort: 30000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: forgejo-data, namespace: byox }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: forgejo, namespace: byox }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: forgejo } }
  template:
    metadata: { labels: { app: forgejo } }
    spec:
      nodeSelector: { byox/vps: a }
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: [sh, -c, "until nc -z postgres 5432; do sleep 1; done"]
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16
          ports: [{ containerPort: 3000 }]
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: FORGEJO__security__INSTALL_LOCK, value: "true" }
            - { name: FORGEJO__server__ROOT_URL, value: "http://localhost:13000/" }
            - { name: FORGEJO__server__DOMAIN, value: localhost }
            - { name: FORGEJO__server__SSH_DOMAIN, value: localhost }
            - { name: FORGEJO__service__DISABLE_REGISTRATION, value: "true" }
            - { name: FORGEJO__service__DEFAULT_ENABLE_DEPENDENCIES, value: "true" }
            - { name: FORGEJO__repository__DEFAULT_PRIVATE, value: private }
            - { name: FORGEJO__repository__DEFAULT_BRANCH, value: main }
            - { name: FORGEJO__actions__ENABLED, value: "true" }
            - { name: FORGEJO__webhook__ALLOWED_HOST_LIST, value: mcp }
            - { name: FORGEJO__database__DB_TYPE, value: postgres }
            - { name: FORGEJO__database__HOST, value: "postgres:5432" }
            - { name: FORGEJO__database__NAME, value: forgejo }
            - { name: FORGEJO__database__USER, value: forgejo }
            - { name: FORGEJO__database__SSL_MODE, value: disable }
            - name: FORGEJO__database__PASSWD
              valueFrom: { secretKeyRef: { name: byox-db, key: FORGEJO_DB_PASSWORD } }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: forgejo-data }
