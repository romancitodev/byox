# El firewall entre las dos VPS. Forgejo y el MCP son públicos por diseño y no llevan política.
# Postgres: sólo Forgejo y el MCP. Runners (B y B2): sin entradas, salvo el Docker para el MCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-solo-la-app, namespace: byox }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app, operator: In, values: [forgejo, mcp] }] }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runner-solo-docker-para-el-mcp, namespace: byox }
spec:
  podSelector: { matchLabels: { app: runner } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: mcp } }
      ports: [{ port: 2375 }]
