# VPS A: una base y un usuario por servicio (lo crea scripts/init-db.sh, igual que en docker-compose.cloud.yml).
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: byox }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: byox }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { byox/vps: a }
      containers:
        - name: postgres
          image: postgres:17
          args: [postgres, -c, shared_buffers=128MB, -c, max_connections=60]
          envFrom: [{ secretRef: { name: byox-db } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: pg-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
