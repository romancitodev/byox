# Las "VPS" de byox: el worker A (Forgejo, Postgres, MCP) y los workers B y B2 (un runner + Docker en cada uno).
# Cada worker es un contenedor, así que `docker update --memory/--cpus` los achica a tamaño de VPS chica.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: byox-sim
nodes:
  - role: control-plane
  - role: worker
    labels:
      byox/vps: a
    extraPortMappings:
      # Forgejo y la web/MCP, en puertos distintos a los del compose (3000/3333).
      - { containerPort: 30000, hostPort: 13000, listenAddress: "127.0.0.1" }
      - { containerPort: 30333, hostPort: 13333, listenAddress: "127.0.0.1" }
  # VPS B y B2: dos máquinas para los runners (worker2 y worker3 de kind), una réplica del runner en cada una.
  - role: worker
    labels:
      byox/vps: b
  - role: worker
    labels:
      byox/vps: b
